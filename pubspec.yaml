name: editaiapp
description: App nativo de edição de fotos com IA
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0
  postgrest: ^2.6.0

  # Deep links (reset senha, etc.)
  app_links: ^6.4.0

  # Push Notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Network
  dio: ^5.4.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image Processing
  image_picker: ^1.0.7
  image_cropper: ^8.0.0
  image: ^4.1.3

  # Utils
  uuid: ^4.2.1
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dartz: ^0.10.1

  # UI
  lottie: ^3.0.0
  animated_text_kit: ^4.3.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  image_compare_slider: ^2.8.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  share_plus: ^12.0.1
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.5
  equatable: any
  webview_flutter: any
  saver_gallery: ^4.1.0
  google_mobile_ads: ^5.1.0

  # Voice prompt (speech-to-text)
  speech_to_text: ^7.0.0

  # Beauty Engine — MediaPipe Face/Pose (Sprint 03+)
  beauty_mediapipe:
    path: packages/beauty_mediapipe
  pro_image_editor: 11.3.0
  flutter_image_filters: 0.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  shaders:
    - lib/features/editor/beauty_engine/shaders/body_reshape_remap.frag
  assets:
    - assets/animations/
    - assets/filters/lut/
    - assets/beauty/presets/
    - assets/logo.png
    - assets/mediapipe/face_landmarker.task
    - assets/mediapipe/pose_landmarker_lite.task
    - assets/mediapipe/selfie_segmenter.tflite
    - assets/branding/
    - assets/home/
    - assets/illustrations/
